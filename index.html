<title>ViTrox Campus Sim</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Noto+Sans+SC:wght@500;700&display=swap">
<style>
/* Layout: one-screen game. Top status rail, isometric campus canvas, right-hand management panel (bottom sheet on phones). */
:root{
  --bg:#f4ecd6; --panel:#fffaf0; --panel-2:#f7efdc; --ink:#1c1a20; --muted:#5d5866; --line:#d9cba6;
  --accent:#17a35e; --accent-ink:#ffffff; --accent-soft:#dff3e7; --gold:#c98314; --bad:#cf3f3f; --warn:#d99a12;
  --stage:#e7d9b8; --shadow:4px 4px 0 #1c1a20; --frame:#1c1a20;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --grid:#e1e0d9; --axis:#c3c2b7;   /* chart series (validated order) and chrome */
  --f-display:"Bangers","Noto Sans SC","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Comic Neue","Figtree","Noto Sans SC","Segoe UI","Microsoft YaHei",system-ui,sans-serif;
  --f-mono:"JetBrains Mono","Noto Sans SC",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c131b; --panel:#141e2a; --panel-2:#1a2635; --ink:#e6edf3; --muted:#93a2b2; --line:#263648;
  --accent:#36cf85; --accent-ink:#06210f; --accent-soft:#163626; --gold:#f0b24a; --bad:#ff6b6b; --warn:#f2c14e;
  --stage:#17241d; --shadow:4px 4px 0 #000; --frame:#c9bfa4;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --grid:#2c2c2a; --axis:#383835; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c131b; --panel:#141e2a; --panel-2:#1a2635; --ink:#e6edf3; --muted:#93a2b2; --line:#263648;
  --accent:#36cf85; --accent-ink:#06210f; --accent-soft:#163626; --gold:#f0b24a; --bad:#ff6b6b; --warn:#f2c14e;
  --stage:#17241d; --shadow:4px 4px 0 #000; --frame:#c9bfa4;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --grid:#2c2c2a; --axis:#383835; color-scheme:dark}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{height:100%;display:grid;grid-template-rows:auto 1fr;gap:10px;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;min-width:0}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.gem{width:16px;height:24px;flex:none;background:var(--accent);clip-path:polygon(50% 0,100% 42%,50% 100%,0 42%);animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:20px;line-height:1;margin:0;letter-spacing:-.01em;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.clock{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.clock .when{font-family:var(--f-mono);font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.speed{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--panel)}
.speed button{border:0;background:none;padding:5px 9px;cursor:pointer;font-family:var(--f-mono);font-size:12px;font-weight:700}
.speed button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.lang{border:1px solid var(--line);border-radius:9px;background:var(--panel);padding:4px 6px;font-size:12px;font-weight:700;cursor:pointer}
.stats{display:flex;flex-wrap:wrap;gap:6px 16px;margin-left:auto}
.stat{display:flex;flex-direction:column;line-height:1.1}
.stat small{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.stat b{font-family:var(--f-mono);font-size:14px;font-variant-numeric:tabular-nums}
.stat b.neg{color:var(--bad)}
main{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:10px;min-height:0}
#stage{position:relative;min-height:0;border-radius:16px;overflow:hidden;background:var(--stage);box-shadow:var(--shadow);touch-action:none}
#gl{position:absolute;inset:0}
#gl canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
#gl canvas:active{cursor:grabbing}
#ov{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#ov>div{position:absolute;left:0;top:0;will-change:transform}
.lbl{background:rgba(20,32,47,.82);color:#fff;font:700 11px/1.2 var(--f-body);padding:3px 8px;border-radius:99px;white-space:nowrap;display:flex;align-items:center;gap:4px}
.lbl .ic{font-size:13px;line-height:1}
.lbl.only{padding:2px 4px;background:rgba(20,32,47,.55)}
.lbl.red{background:rgba(220,40,40,.92)}.lbl.green{background:rgba(23,163,94,.94)}
.lbl.tag{background:rgba(31,138,138,.92);font-size:10px;letter-spacing:.04em}
.lbl.road{background:rgba(60,66,74,.85);font-size:10px;font-weight:600}
.bub{background:#fff;color:#14202f;font:600 12px/1.35 var(--f-body);padding:6px 10px;border-radius:10px;max-width:180px;width:max-content;box-shadow:0 3px 10px rgba(0,0,0,.22);border:1px solid rgba(20,32,47,.18);overflow-wrap:anywhere}
.bub.think{font-style:italic;color:#3d4a5c;border-radius:16px}
.bub.say::after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-6px;border:6px solid transparent;border-top-color:#fff;border-bottom:0}
.bub.think::after{content:"";position:absolute;left:50%;bottom:-11px;width:7px;height:7px;border-radius:50%;background:#fff;border:1px solid rgba(20,32,47,.18)}
#compass{position:absolute;left:12px;bottom:12px;width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.9);border:1px solid rgba(20,32,47,.25);pointer-events:none}
#needle{position:absolute;inset:0}
#needle i{position:absolute;left:50%;top:7px;margin-left:-5px;border:5px solid transparent;border-bottom:16px solid #cf3f3f;border-top:0}
#needle i::after{content:"";position:absolute;left:-5px;top:16px;border:5px solid transparent;border-top:16px solid #14202f;border-bottom:0}
#needle b{position:absolute;left:50%;top:-16px;transform:translateX(-50%);font:800 11px var(--f-body);color:#cf3f3f;text-shadow:0 0 3px #fff}
#followbar{position:absolute;left:50%;top:10px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 6px 5px 12px;box-shadow:var(--shadow);max-width:calc(100% - 110px);font-size:12.5px}
#followbar .ft{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#followbar .btn{padding:4px 10px;border-radius:999px}
.zoom{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:4px}
.zoom button,.iconbtn{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-weight:700;font-size:16px}
.zoom button[aria-pressed="false"]{opacity:.5}
.hint{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:6px 12px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;max-width:calc(100% - 100px);overflow:hidden;text-overflow:ellipsis}
#toasts{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px;align-items:flex-end;max-width:min(340px,calc(100% - 20px));pointer-events:none}
.toast{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:7px 10px;font-size:12.5px;box-shadow:var(--shadow);animation:tin .25s ease-out}
.toast.bad{border-left-color:var(--bad)}.toast.warn{border-left-color:var(--warn)}.toast.gold{border-left-color:var(--gold)}
@keyframes tin{from{transform:translateY(8px);opacity:.3}}
#insp{position:absolute;left:10px;bottom:10px;width:min(300px,calc(100% - 20px));max-height:calc(100% - 20px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:var(--shadow);font-size:13px}
#insp h3{font-family:var(--f-display);font-size:17px;margin:0 0 2px;display:flex;align-items:center;gap:8px;padding-right:28px}
#insp .sub{color:var(--muted);font-size:12px;margin-bottom:8px}
#insp .x{position:absolute;right:8px;top:8px;width:26px;height:26px;font-size:14px}
.th{font-size:12px;line-height:1.35;padding:3px 0;border-top:1px dashed var(--line)}
.th .muted{font-family:var(--f-mono);font-size:10.5px;margin-right:4px}
.need{display:grid;grid-template-columns:78px 1fr;align-items:center;gap:8px;margin:4px 0;font-size:12px}
.bar{height:8px;border-radius:99px;background:var(--panel-2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.bar i.mid{background:var(--warn)}.bar i.low{background:var(--bad)}
#panel{min-height:0;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto;flex:none}
.tabs button{flex:1 0 auto;border:0;background:none;padding:11px 10px;cursor:pointer;font-weight:700;font-size:12.5px;color:var(--muted);border-bottom:2px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
#tabbody{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:14px;min-height:0}
.sec h4{font-family:var(--f-display);font-size:15px;margin:0 0 8px;font-weight:800}
.eyebrow{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0 0 6px}
.muted{color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.bcard{display:flex;flex-direction:column;gap:3px;text-align:left;padding:9px;border:1px solid var(--line);border-radius:11px;background:var(--panel-2);cursor:pointer;min-width:0}
.bcard:hover{border-color:var(--accent)}
.bcard[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.bcard[disabled]{opacity:.5;cursor:not-allowed}
.bcard .t{font-weight:700;font-size:12.5px;display:flex;gap:6px;align-items:center}
.bcard .p{font-family:var(--f-mono);font-size:11.5px;color:var(--gold);font-weight:700}
.bcard .kv{display:flex;flex-wrap:wrap;gap:4px}
.bcard .kv span{font-size:10.5px;font-weight:700;padding:2px 6px;border-radius:6px;background:var(--panel);border:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
.bcard .kv .cost{color:var(--gold)}
.bcard .kv .up{color:var(--accent)}
.bcard .sat{font-size:11px;font-weight:600;line-height:1.35}
.bcard .hot{margin-left:auto;font-size:10px;font-weight:800;letter-spacing:.04em;padding:2px 6px;border-radius:99px;background:var(--bad);color:#fff}
.row{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);min-width:0}
.row:last-child{border-bottom:0}
.row .l{min-width:0;flex:1}
.row .n{font-weight:600;font-size:13px}
.row .d{font-size:11.5px;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--panel);padding:6px 10px;border-radius:9px;cursor:pointer;font-weight:700;font-size:12px;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.tag{font-size:10.5px;font-weight:700;padding:2px 6px;border-radius:6px;background:var(--panel-2);border:1px solid var(--line);white-space:nowrap}
.tag.ok{color:var(--accent);border-color:var(--accent)}.tag.wip{color:var(--warn);border-color:var(--warn)}
.req{display:grid;grid-template-columns:18px 1fr auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line);font-size:12.5px}
.req .ic{width:16px;height:16px;border-radius:50%;border:2px solid var(--line)}
.req.ok .ic{background:var(--accent);border-color:var(--accent)}
.req .v{font-family:var(--f-mono);font-size:11.5px;font-variant-numeric:tabular-nums}
.ladder{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.rung{padding:8px;border-radius:10px;border:1px solid var(--line);font-size:11.5px;font-weight:700;text-align:center}
.rung.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rung.done{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.fin{width:100%;border-collapse:collapse;font-size:12.5px}
.fin td{padding:4px 0;border-bottom:1px solid var(--line)}
.fin td:last-child{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.fin tr.tot td{font-weight:800;border-bottom:0}
.sw{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.sw input[type=checkbox]{margin-top:3px;accent-color:var(--accent);width:16px;height:16px;flex:none}
input[type=range]{width:100%;accent-color:var(--accent)}
#modal{position:fixed;inset:0;background:rgba(8,14,22,.55);display:grid;place-items:center;padding:16px;z-index:10}
.card{width:min(540px,100%);max-height:calc(100% - 20px);overflow:auto;background:var(--panel);color:var(--ink);border-radius:18px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:12px}
.card h2{font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1.15;margin:0;text-wrap:balance}
.card p{margin:0;line-height:1.55}
.card .choices{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.card .choices .btn{text-align:left;padding:10px 12px;white-space:normal;font-size:13px}
.card .fine{font-size:11.5px;color:var(--muted)}
.card input[type=text]{font:inherit;padding:8px 10px;border-radius:9px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink)}
.langrow{display:flex;gap:6px;flex-wrap:wrap}
.card.wide{width:min(780px,100%)}
.scn{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.scn-c{gap:6px;padding:12px}
.scn-c .t{font-size:14px}
.scn-c .diff{margin-left:auto;color:var(--gold);letter-spacing:1px;font-size:12px}
.scn-c .gl{font-size:11.5px;line-height:1.4}
/* reports tab */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:5px 10px;font-size:12px;font-weight:700;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chart{position:relative}
.chart canvas{width:100%;height:150px;display:block;cursor:crosshair}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--muted);margin:0 0 4px}
.legend i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
.legend i.bar{height:9px;width:9px}
.tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:11.5px;box-shadow:var(--shadow);white-space:nowrap;z-index:2}
.tip b{display:block;margin-bottom:2px}
.tip span{display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.tip i{width:8px;height:8px;border-radius:2px;display:inline-block}
.yr{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--panel-2)}
.yr h5{font-family:var(--f-display);font-size:15px;margin:0 0 6px;font-weight:800}
.deltas{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
.deltas span{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;border:1px solid var(--line);background:var(--panel);font-variant-numeric:tabular-nums}
.deltas .good{color:var(--accent)}.deltas .bad{color:var(--bad)}
.why{margin:0 0 6px;padding:0;list-style:none;font-size:12px;display:flex;flex-direction:column;gap:3px}
.why li{display:flex;gap:6px;line-height:1.4}
.dlog{font-size:12px;border-top:1px dashed var(--line);padding:5px 0;display:grid;grid-template-columns:52px 18px 1fr;gap:6px}
.dlog .when{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);padding-top:1px}
.dlog .res{display:block;color:var(--muted);font-size:11.5px}
.dtable{overflow-x:auto}
.dtable table{border-collapse:collapse;font-size:11px;width:100%}
.dtable th,.dtable td{padding:3px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.dtable th:first-child,.dtable td:first-child{text-align:left}
.opt{border:2px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--panel);margin-top:6px}
.opt .why li{font-size:12px}
.langrow .btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
@media (max-width:860px){
  main{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) 44%}
  .stats{margin-left:0}
  .brand h1{font-size:17px}
}
/* comic page: ink-ruled panels, hard offset shadows, lettered balloons, sound-effect bursts */
#stage,#panel{border:3px solid var(--frame)}
.card{border:3px solid var(--frame);box-shadow:6px 6px 0 var(--frame)}
#insp,.toast,#followbar{border:2.5px solid var(--frame)}
.toast{border-left-width:7px}
.brand h1,.card h2,.sec h4,#insp h3,.yr h5{letter-spacing:.03em;font-weight:400}
.brand h1{font-size:24px}.card h2{font-size:30px}.sec h4{font-size:18px}#insp h3{font-size:20px}
.btn,.bcard,.tabs button{font-weight:700}
.btn{border:2px solid var(--frame)}
.btn.pri{box-shadow:2px 2px 0 var(--frame)}
.bub{font:700 12.5px/1.25 "Comic Neue","Noto Sans SC",sans-serif;text-transform:uppercase;letter-spacing:.02em;background:#fffaf0;color:#1c1a20;border:2.5px solid #1c1a20;border-radius:16px;box-shadow:none}
.bub.think{font-style:normal;color:#1c1a20;border-radius:22px;border-style:solid}
.bub.say::before{content:"";position:absolute;left:50%;bottom:-11px;margin-left:-8px;border:8px solid transparent;border-top:11px solid #1c1a20;border-bottom:0}
.bub.say::after{bottom:-6px;margin-left:-5px;border-width:5px;border-top-width:7px;border-top-color:#fffaf0}
.bub.think::after{bottom:-12px;width:8px;height:8px;border:2px solid #1c1a20;background:#fffaf0}
.lbl{font-family:"Comic Neue","Noto Sans SC",sans-serif;border:2px solid #1c1a20;background:rgba(28,26,32,.88)}
#compass{border:2.5px solid #1c1a20;background:#fffaf0}
.sfx{position:absolute;pointer-events:none;z-index:4;white-space:nowrap;padding:24px 34px;font:400 34px/1 "Bangers","Noto Sans SC",sans-serif;letter-spacing:.05em;color:#f6c536;
  -webkit-text-stroke:2px #1c1a20;text-shadow:3px 3px 0 #1c1a20;animation:sfxpop 1.8s steps(1,end) forwards,sfxfade 1.8s ease-out forwards}
.sfx::before,.sfx::after{content:"";position:absolute;z-index:-1;clip-path:polygon(50% 0%,61% 22%,85% 10%,78% 35%,100% 50%,78% 65%,85% 90%,61% 78%,50% 100%,39% 78%,15% 90%,22% 65%,0% 50%,22% 35%,15% 10%,39% 22%)}
.sfx::before{inset:0;background:#1c1a20}
.sfx::after{inset:5px 7px;background:#dd3b2d}
/* pops in on twos with a little overshoot, then holds still */
@keyframes sfxpop{0%{transform:translate(-50%,-50%) rotate(var(--rot)) scale(.3)}6%{transform:translate(-50%,-50%) rotate(var(--rot)) scale(1.22)}12%{transform:translate(-50%,-50%) rotate(var(--rot)) scale(.94)}18%,100%{transform:translate(-50%,-50%) rotate(var(--rot)) scale(1)}}
@keyframes sfxfade{0%,80%{opacity:1}100%{opacity:0}}

function blockedTile(x, y) {
  if (x === POND.x - 1 && y >= 18 && y <= 19) return 'pond';   // gazebo and jetty landing
  if (x >= VIE.x && x < VIE.x + VIE.w && y >= VIE.y && y < VIE.y + VIE.h) return 'vie';
  if (x >= POND.x && x < POND.x + POND.w && y >= POND.y && y < POND.y + POND.h) {
    const cx = POND.x + POND.w / 2, cy = POND.y + POND.h / 2, dx = (x + 0.5 - cx) / (POND.w / 2), dy = (y + 0.5 - cy) / (POND.h / 2);
    if (dx * dx + dy * dy < 1.05) return 'pond';
  }
  return null;
}

function capacity() {
  let seats = 0, eng = 0, comp = 0, food = 0, fun = 0, beds = 0;
  for (const b of S.buildings) {
    const d = BT[b.t];
    if (d.seats) seats += d.seats;
    if (d.lab === 'eng') eng += d.labSeats; if (d.lab === 'comp') comp += d.labSeats;
    if (b.t === 'cafe') food += d.cap; else if (d.cap) fun += d.cap;
    if (d.beds) beds += d.beds;
  }
  return { teach: Math.round(seats * 2.5), eng: eng * 4, comp: comp * 4, food: food * 3, fun: fun * 4, beds };
}
function counts() {
  const c = { students: 0, eng: 0, comp: 0, mgmt: 0, postgrad: 0, running: 0, own: 0, masters: 0, phdp: 0,
    staff: S.staff.length, phd: 0, prof: 0, master: 0, ind: 0, sch: { eng: [0,0,0], comp: [0,0,0], mgmt: [0,0,0] } };
  for (const co of S.cohorts) { c.students += co.count; c[P[co.p].school] += co.count; if (['mas','phd'].includes(P[co.p].lvl)) c.postgrad += co.count; }
  for (const p of PROGS) if (S.progs[p.id].state === 'running') { c.running++; if (p.lvl === 'deg') c.own++; if (p.lvl === 'mas') c.masters++; if (p.lvl === 'phd') c.phdp++; }
  for (const s of S.staff) { c[s.role]++; const a = c.sch[s.school]; a[0]++; if (s.role === 'phd' || s.role === 'prof') a[1]++; if (s.role === 'prof') a[2]++; }
  c.phdPct = c.staff ? Math.round((c.phd + c.prof) / c.staff * 100) : 0;
  c.ratio = c.staff ? c.students / c.staff : 99;
  return c;
}
function crowd() {
  const k = capacity(), c = counts(), n = Math.max(1, c.students);
  return { teach: Math.min(1, k.teach / n), eng: c.eng ? Math.min(1, k.eng / c.eng) : 1, comp: c.comp ? Math.min(1, k.comp / c.comp) : 1,
    food: Math.min(1, k.food / n), fun: Math.min(1, k.fun / n), bed: Math.min(1, k.beds / n) };
}
let CROWD = null;
function crowdFor(t) {
  if (!CROWD) CROWD = crowd();
  if (t === 'cafe') return CROWD.food; if (SPORT_T.includes(t) || t === 'lounge') return CROWD.fun;
  if (t === 'englab' || t === 'industry') return CROWD.eng; if (t === 'complab') return CROWD.comp;

}

function makeSim(kind, ref) {

function syncSims() {
  CROWD = crowd();
  const c = counts();
  const wantS = Math.min(48, c.students), wantT = Math.min(16, S.staff.length);
  let stu = sims.filter(s => s.kind === 'student');
  while (stu.length > wantS) { const s = stu.pop(); sims.splice(sims.indexOf(s), 1); }
  while (stu.length < wantS) { const s = makeSim('student'); sims.push(s); stu.push(s); }
  for (const s of stu) if (Math.random() < 0.1) s.resident = Math.random() < CROWD.bed;
  const ids = new Set(S.staff.map(s => s.id));
  sims = sims.filter(s => s.kind !== 'staff' || ids.has(s.staffId));
  const shown = new Set(sims.filter(s => s.kind === 'staff').map(s => s.staffId));
  for (const st of S.staff) { if (sims.filter(s => s.kind === 'staff').length >= wantT) break; if (!shown.has(st.id)) sims.push(makeSim('staff', st)); }
  for (const s of sims) if (s.kind === 'staff') { const st = S.staff.find(x => x.id === s.staffId); if (st) s.role = st.role; }
}
function door(b) { const d = BT[b.t]; return { x: b.x + d.w / 2, y: b.y + d.h + 0.3 }; }

function goOff(s, until, act) { const g = gate(); s.tx = g.x + rnd(-0.4, 0.4); s.ty = g.y + rnd(-0.2, 0.2); s.dest = 'off'; s.offUntil = until; setAct(s, act); s.state = 'walk'; s.bld = null; }

  for (let i = 0; i < 8; i++) { s.tx = clamp(s.x + rnd(-3, 3), 0.5, GRID - 0.5); s.ty = clamp(s.y + rnd(-3, 3), 0.5, GRID - 0.5); if (!blockedTile(Math.floor(s.tx), Math.floor(s.ty))) break; }
  s.dest = 'idle'; s.stay = rnd(0.5, 1.2); setAct(s, act); s.state = 'walk'; s.bld = null;

const SS_W = { teach: .15, qual: .08, fac: .1, support: .1, prep: .12 };

function success(p, c) {
  if (!CROWD) CROWD = crowd();
  const a = c.sch[p.school], ratio = a[0] ? c[p.school] / a[0] : 60;
  const lab = p.school === 'eng' ? Math.min(CROWD.eng, CROWD.teach) : p.school === 'comp' ? Math.min(CROWD.comp, CROWD.teach) : CROWD.teach;
  const f = { teach: clamp(1 - Math.max(0, ratio - 20) / 40, 0, 1), qual: Math.min(1, a[0] ? a[1] / a[0] * 2.5 : 0), fac: clamp(lab * (has('library') ? 1 : .85), 0, 1),
    support: Math.min(1, SUPPORT[S.support].v * .75 + (S.policies.mentor ? .3 : 0)), prep: ENTRY[S.entry].prep };
  const diff = { dip: 0, fra: .03, deg: .04, mas: .02, phd: 0 }[p.lvl];

  const weak = Object.keys(SS_W).sort((x, y) => SS_W[y] * (1 - f[y]) - SS_W[x] * (1 - f[x]))[0];
  return { pass, f, ratio, weak };
}
// enrolment-weighted pass rate and students at risk across running programmes, right now
function ssNow(c) {
  let n = 0, pw = 0, risk = 0;
  for (const p of PROGS) { const e = enrolledIn(p.id); if (!e) continue; const s = success(p, c); n += e; pw += e * s.pass; risk += Math.round(e * (1 - s.pass) * .6); }
  let grad = 0, drop = 0, late = 0; for (const k in S.ss) { grad += S.ss[k].grad; drop += S.ss[k].drop; late += S.ss[k].late; }
  return { pass: n ? pw / n : .85, risk, grad, drop, gradRate: grad ? grad / (grad + drop) : null, onTime: grad ? 1 - late / grad : null };
}
// a month of study: students who struggle may fall behind a semester or drop out; finishing cohorts graduate
function studentMonth(c) {
  const out = { grads: 0, drops: 0 }, pr = {};
  for (const co of S.cohorts) {
    const p = P[co.p], r = pr[co.p] ||= success(p, c), fail = 1 - r.pass, ss = S.ss[co.p] ||= { grad: 0, drop: 0, late: 0 };
    const l = Math.min(co.count, Math.floor(co.count * (fail * .035 + Math.max(0, 60 - S.sat) * .0006) + Math.random()));
    co.count -= l; ss.drop += l; out.drops += l;
    co.slip = (co.slip || 0) + fail * .18; if (co.slip >= 1) { co.slip -= 1; co.left++; co.late = true; }
    if (--co.left <= 0) { ss.grad += co.count; if (co.late) ss.late += co.count; out.grads += co.count; co.count = 0; }
  }
  S.cohorts = S.cohorts.filter(co => co.count > 0);
  return out;
}

function industryCalc(c) {

  const byS = {}; let placed = 0, fromP = 0, left = studio; const uncovered = [];

    left -= p2; byS[sc] = { el: el[sc], slots: Math.round(sl[sc]), pl: p1 + p2 }; placed += p1 + p2; fromP += p1;

  }
  const wanted = placed, capped = placed > sup;
  if (capped) { const k = sup / placed; placed = 0; for (const sc in byS) { byS[sc].pl = Math.floor(byS[sc].pl * k); placed += byS[sc].pl; } fromP *= k; }
  const eligible = el.eng + el.comp + el.mgmt, slots = Math.round(sl.eng + sl.comp + sl.mgmt);

function pickObj() {

function hireStaff(i) {

  logD('hire', ['Hired {n} ({r}, {c}/month)','Mengambil {n} ({r}, {c}/bulan)','聘请 {n}（{r}，月薪 {c}）'], { n: ROLES[s.role].title + s.name, r: ROLES[s.role].t, c: fmtRM(s.salary) });

// one place for every action button on these tabs, so the advisor can trigger the same moves
function doAct(a, from) {
  const [k, x, y] = a.split(':');
  if (from) logD('advisor', ['Followed the advisor: {x}','Mengikut nasihat penasihat: {x}','采纳顾问建议：{x}'], { x: from });
  if (['people', 'ind', 'qual', 'goals', 'fin', 'progs'].includes(k)) return setTab(k);
  if (k === 'build') { setTab('build'); setTool(x); return; }
  if (k === 'task') return startTask(x, y);
  if (k === 'iap') return holdIAP(x);
  if (k === 'sign') return signPartner(x);
  if (k === 'pol') { S.policies[x] = y === 'on'; logD('policy', y === 'on' ? ['Turned on {x}','Menghidupkan {x}','开启{x}'] : ['Turned off {x}','Mematikan {x}','关闭{x}'], { x: POL_N[x] }); }
  else if (k === 'borrow' && S.loan < 3e6) { S.loan += 1e6; S.cash += 1e6; logD('loan', ['Borrowed RM 1M (0.5% a month)','Meminjam RM 1M (0.5% sebulan)','借贷 RM 1M（月息 0.5%）']); toast(tr(['RM 1M loan received.','Pinjaman RM 1M diterima.','已收到 RM 1M 贷款。'])); }
  else if (k === 'repay' && S.loan >= 1e6 && S.cash >= 1e6) { S.loan -= 1e6; S.cash -= 1e6; logD('loan', ['Repaid RM 1M','Membayar balik RM 1M','偿还 RM 1M']); toast(tr(['RM 1M repaid.','RM 1M telah dibayar balik.','已偿还 RM 1M。'])); }
  else if (k === 'mkt') { S.marketing = Math.max(0, S.marketing - 10000); logD('budget', ['Set the marketing budget to {c}/month','Menetapkan bajet pemasaran {c}/bulan','市场推广预算调为每月 {c}'], { c: fmtRM(S.marketing) }); }
  else if (k === 'sup') { S.support = +x; logD('support', ['Set academic support to {x}','Menetapkan sokongan akademik: {x}','学业支持调为：{x}'], { x: SUPPORT[S.support].n }); }
  else if (k === 'entry') { S.entry = x; logD('support', ['Set the entry standard to {x}','Menetapkan standard kemasukan: {x}','入学标准调为：{x}'], { x: ENTRY[x].n }); }
  else if (k === 'hire') hireStaff(S.pool.findIndex(s => s.id === +x));
  refreshPanel(true); updateTop();
}
function bindActs() { body.querySelectorAll('[data-ia]').forEach(b => b.onclick = () => doAct(b.dataset.ia)); }

function drawSpark() {
  const c = document.getElementById('spark'); if (!c) return; const r = c.getBoundingClientRect(), d = Math.min(2, devicePixelRatio || 1);
  c.width = r.width * d; c.height = r.height * d; const g = c.getContext('2d'); g.scale(d, d);
  const hs = S.history.map(x => x.cash); const css = getComputedStyle(document.documentElement);
  const acc = css.getPropertyValue('--accent').trim(), mut = css.getPropertyValue('--muted').trim(), line = css.getPropertyValue('--line').trim();
  if (hs.length < 2) { g.fillStyle = mut; g.font = '12px Figtree, "Noto Sans SC", sans-serif'; g.fillText(tr(['Builds up month by month.','Terbina bulan demi bulan.','逐月累积。']), 4, 48); return; }
  const mn = Math.min(0, ...hs), mx = Math.max(...hs), pad = 14, w = r.width, h = r.height;
  const X = i => i / (hs.length - 1) * (w - 8) + 4, Y = v => h - pad - (v - mn) / (mx - mn || 1) * (h - pad * 2);
  g.strokeStyle = line; g.beginPath(); g.moveTo(0, Y(0)); g.lineTo(w, Y(0)); g.stroke();
  g.beginPath(); hs.forEach((v, i) => i ? g.lineTo(X(i), Y(v)) : g.moveTo(X(i), Y(v)));
  g.strokeStyle = acc; g.lineWidth = 2; g.stroke();
  g.lineTo(X(hs.length - 1), Y(mn)); g.lineTo(X(0), Y(mn)); g.closePath(); g.globalAlpha = 0.12; g.fillStyle = acc; g.fill(); g.globalAlpha = 1;
  g.fillStyle = acc; g.beginPath(); g.arc(X(hs.length - 1), Y(hs[hs.length - 1]), 3.5, 0, 7); g.fill();
  g.fillStyle = mut; g.font = '600 11px "JetBrains Mono", monospace'; g.textAlign = 'right'; g.fillText(fmtRM(hs[hs.length - 1]), w - 4, 11);
}

// ================= top bar =================
function updateTop() {
  const c = counts(); counts_cache = c;
  document.getElementById('cname').textContent = collegeName();
  document.getElementById('stagechip').textContent = tr(STAGES[S.stage]);
  document.getElementById('when').textContent = fmtDate(S.hours);
  const cash = document.getElementById('sCash'); cash.textContent = fmtRM(S.cash); cash.className = S.cash < 0 ? 'neg' : '';
  document.getElementById('sStu').textContent = fmtN(c.students);
  document.getElementById('sStaff').textContent = `${c.staff} · ${c.phdPct}% PhD`;
  document.getElementById('sRep').textContent = `${Math.round(S.rep)}/100`;
  const sat = document.getElementById('sSat'); sat.textContent = Math.round(S.sat) + '%'; sat.className = S.sat < 50 ? 'neg' : '';
  document.getElementById('sRes').textContent = fmtN(S.research);
}

// ================= loop =================
let last = performance.now(), topT = 0, inspT = 0;
function frame(t) {
  const dt = Math.min(0.1, (t - last) / 1000); last = t;
  if (S && speed > 0 && !modalOpen() && !S.over) advance(dt * speed / SEC_PER_HOUR);
  if (S) {
    render3D(t);
    if (t - topT > 250) { topT = t; updateTop(); }
    if (t - inspT > 300) { inspT = t; if (sel && ['s', 'b', 'hq', 'pond'].includes(sel.type)) renderInsp(); if (follow) updateFollowBar(); }
  }
  requestAnimationFrame(frame);
}
new ResizeObserver(() => { if (!camTouched) fitCam(); else resize3D(); }).observe(glEl);

// ================= boot =================
applyStatic();
newGame(); CROWD = crowd(); syncSims(); buildWorld(); fitCam(); setSpeed(1); setTab('goals'); updateTop();
showWelcome(hasSave());
requestAnimationFrame(frame);
</script>
